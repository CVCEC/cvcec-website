name: Copy images from the old website

# Downloads every image listed in images.txt (from the old Webador site)
# into docs/images/, shrinks very large photos, and commits them.
# Runs when images.txt changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - images.txt
      - .github/workflows/fetch-images.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download missing images
        run: |
          mkdir -p docs/images
          failed=0
          while read -r url name; do
            [ -z "$url" ] && continue
            [ -s "docs/images/$name" ] && continue
            if ! curl -fsSL --retry 3 --retry-delay 2 -A "Mozilla/5.0 (CVCEC website migration)" "$url" -o "docs/images/$name"; then
              echo "::warning::Could not download $url"
              rm -f "docs/images/$name"
              failed=$((failed+1))
            fi
          done < images.txt
          echo "Failed downloads: $failed"

      - name: Shrink very large photos
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null
          find docs/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) -size +500k -print0 \
            | xargs -0 -r mogrify -resize '2000x2000>' -strip -quality 82
          find docs/images -type f -iname '*.png' -size +1500k -print0 \
            | xargs -0 -r mogrify -resize '2000x2000>' -strip
          du -sh docs/images

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Copy images from the old cvcec.org website"
            git push
          fi
